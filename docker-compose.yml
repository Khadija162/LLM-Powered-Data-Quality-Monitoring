services:
  api:
    build: .
    environment:
      LLM_MODE: mock
      REPORT_PATH: /app/artifacts/latest.json
    volumes:
      - ./artifacts:/app/artifacts:ro
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build: .
    command: ["streamlit", "run", "frontend/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on: [api]
